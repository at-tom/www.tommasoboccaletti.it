<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tommaso Boccaletti Portfolio</title>

    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="mobile.css" media="(max-width: 900px)" />
    <link rel="icon" type="image/png" href="/favicon.png">

    <!-- Preload primary assets to avoid network waterfall on hard reload -->
    <link rel="modulepreload" href="https://esm.sh/three@0.160.0" />
    <link rel="modulepreload" href="https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js" />
    <link rel="preload" href="ASSETS/ape.glb" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="ASSETS/progetti/emergentissimi_0.webp" as="image" />
    <link rel="preload" href="ASSETS/progetti/emergentissimi_1.webp" as="image" />
</head>

<body>

    <div id="custom-cursor" aria-hidden="true">
        <div class="cursor-icon"></div>
        <div class="cursor-caption" id="cursor-caption"></div>
    </div>

    <div id="loading-screen" class="loading-screen">
        <div class="loading-zzz">
            <span style="animation-delay:0.1s">B</span><span style="animation-delay:0.3s">z</span><span
                style="animation-delay:0.5s">z</span><span style="animation-delay:0.7s">z</span>
        </div>
    </div>

    <div class="scroll-snap-wrapper" id="snap-wrapper">

        <section class="top-section snap-child" id="top-section">

            <header class="site-header h-margin">
                <a href="#top-section" class="header-left" data-fly data-swap="l">Portfolio of*</a>
                <a href="#projects" class="header-center" data-fly data-swap="c">Projects</a>
                <a href="about.html" class="header-right" data-fly data-swap="r">About me</a>
            </header>

            <div id="landing" class="landing">
                <div id="canvas-container"></div>

                <div class="landing-label label-visual h-margin" data-fly data-swap="l">Visual</div>
                <div class="landing-label label-designer h-margin" data-fly data-swap="r">Designer</div>
            </div>

            <div class="landing-footer h-margin">
                <span class="footer-left" data-fly data-swap="l">*Tommaso Boccaletti</span>
                <span class="footer-center" data-fly>
                    <span class="hint-scroll"><span class="hint-bob">scroll down to enter my world</span></span>
                </span>
                <span class="footer-right" data-fly data-swap="r">© 2026 all rights reserved</span>
            </div>

            <!-- minigame UI: sits above the landing, never in the middle of the screen -->
            <div class="game-ui" id="game-ui">
                <div class="game-line game-msg" id="hover-msg" aria-hidden="true">double click to play with the bee
                </div>
                <div class="game-line game-msg" id="game-msg" role="status" aria-live="polite"></div>
                <div class="game-line game-slot" id="game-live" aria-hidden="true"></div>
                <button type="button" class="game-line game-slot game-max" id="bee-score"
                    aria-label="max score, open top 10"></button>
                <div class="game-timer" id="game-timer" aria-hidden="true"><i></i></div>
            </div>

        </section>

        <section id="projects" class="projects-section snap-child">

            <div class="projects-left">
                <div class="text-col h-margin" id="text-col">

                    <div class="separator" aria-hidden="true">
                        <span>*</span><span>*</span><span>*</span>
                    </div>

                    <nav class="projects-list" id="projects-list">
                    </nav>

                    <div class="group-meta" id="group-meta">
                        <div class="separator" aria-hidden="true">
                            <span>*</span><span>*</span><span>*</span>
                        </div>

                        <div class="projects-meta" id="projects-meta">
                        </div>

                    </div>

                    <div class="text-col-footer">
                        <a href="#top-section" class="footer-left hover-swap">
                            <span class="swap-original">Tommaso Boccaletti</span>
                            <span class="swap-hover">to the bee</span>
                        </a>
                        <a href="about.html" class="footer-center">About me</a>
                        <span class="footer-right">© 2026 all rights reserved</span>
                    </div>

                </div>
            </div>

            <div class="projects-right" id="projects-right">
            </div>
        </section>

    </div>

    <div id="mobile-projects-feed"></div>

    <div id="page-flash" class="page-flash" aria-hidden="true"></div>

    <div id="lightbox-header" class="lightbox-header">
        <span id="lb-title"></span>
    </div>
    <button id="lightbox-close" class="lightbox-close" aria-label="Chiudi galleria">&times;</button>

    <div id="m-lightbox" class="m-lightbox">
        <div id="m-lightbox-header" class="m-lightbox-header"></div>
        <button id="m-lightbox-close" class="m-lightbox-close" aria-label="Chiudi galleria">&times;</button>
        <div id="m-lightbox-content" class="m-lightbox-content"></div>
    </div>

    <script type="module" src="script.js"></script>
    <script type="module" src="mobile.js"></script>
</body>

</html>
